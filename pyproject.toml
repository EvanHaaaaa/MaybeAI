[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maybeai"
version = "1.0.0"
description = "Autonomous AI VTuber Streamer System (Eve Maybe) with Full-Duplex Voice, Closed-Loop Missions, AI Collab Protocol, and Plugin SDK"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "edge-tts>=6.1.9",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "pygame>=2.5.2",
    "numpy>=1.26.0",
    "python-chess>=1.11.0",
    "pillow>=10.0.0",
    "mss>=9.0.0",
]

[project.optional-dependencies]
stt-local = [
    "faster-whisper>=1.0.0",
    "openai-whisper>=20231117",
]
embeddings-local = [
    "sentence-transformers>=2.6.0",
    "fastembed>=0.3.0",
]
tts-local = [
    "kokoro>=0.9.4",
    "kokoro-onnx>=0.4.0",
]
tiktok = [
    "TikTokLive>=6.0.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["core*"]
